<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    :root {
      color-scheme: light dark;
    }
    .circle-bg {
      fill: #12151a;
      stroke: #262b35;
      stroke-width: 16;
    }
    .letter {
      fill: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 280px;
    }
    .accent {
      fill: #5b8c5a;
    }

    @media (prefers-color-scheme: light) {
      .circle-bg {
        fill: #ffffff;
        stroke: #e5e7eb;
      }
      .letter {
        fill: #12151a;
      }
      .accent {
        fill: #3e683d;
      }
    }
  </style>
  <circle cx="256" cy="256" r="236" class="circle-bg" />
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="letter" dy=".02em">S</text>
</svg>
